<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Artist Concentration | Music Trade Economy</title>
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Inter', -apple-system, sans-serif; background: #0a0a0a; color: #e0e0e0; padding: 2rem; }
    h1 { font-size: 1.8rem; font-weight: 700; color: #fff; margin-bottom: 0.5rem; }
    .subtitle { font-size: 1rem; color: #888; margin-bottom: 2rem; }
    #chart { width: 100%; max-width: 1000px; margin: 0 auto; }
    .tooltip {
      position: absolute;
      background: #222;
      border: 1px solid #444;
      border-radius: 6px;
      padding: 10px 14px;
      font-size: 12px;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.15s;
      line-height: 1.5;
    }
    .legend { display: flex; gap: 1.5rem; margin-bottom: 1.5rem; flex-wrap: wrap; }
    .legend-item { display: flex; align-items: center; gap: 6px; font-size: 0.85rem; color: #aaa; }
    .legend-swatch { width: 14px; height: 14px; border-radius: 3px; }
  </style>
</head>
<body>
  <h1>Export Concentration: How Many Artists Drive a Country's Music Exports?</h1>
  <p class="subtitle">Percentage of foreign chart-weeks attributable to top N artists per origin country</p>

  <div class="legend" id="legend"></div>
  <div id="chart"></div>
  <div class="tooltip" id="tooltip"></div>

  <script>
    const colors = {
      top1: '#ff6b6b',
      top5: '#feca57',
      top10: '#48dbfb',
      top20: '#1dd1a1',
      rest: '#333'
    };

    const legendData = [
      { key: 'top1', label: 'Top 1 artist' },
      { key: 'top5', label: 'Top 2-5' },
      { key: 'top10', label: 'Top 6-10' },
      { key: 'top20', label: 'Top 11-20' },
      { key: 'rest', label: 'All others' },
    ];

    const legend = d3.select('#legend');
    legendData.forEach(d => {
      const item = legend.append('div').attr('class', 'legend-item');
      item.append('div').attr('class', 'legend-swatch').style('background', colors[d.key]);
      item.append('span').text(d.label);
    });

    fetch('artist_concentration.json')
      .then(r => r.json())
      .then(data => {
        // Sort by top1 concentration (most concentrated first)
        data.sort((a, b) => b.top1_pct - a.top1_pct);

        const margin = { top: 30, right: 200, bottom: 20, left: 130 };
        const barHeight = 32;
        const height = data.length * barHeight + margin.top + margin.bottom;
        const width = 1000;
        const innerWidth = width - margin.left - margin.right;

        const svg = d3.select('#chart')
          .append('svg')
          .attr('viewBox', `0 0 ${width} ${height}`)
          .attr('width', '100%');

        const g = svg.append('g')
          .attr('transform', `translate(${margin.left},${margin.top})`);

        const y = d3.scaleBand()
          .domain(data.map(d => d.name))
          .range([0, data.length * barHeight])
          .padding(0.25);

        const x = d3.scaleLinear()
          .domain([0, 100])
          .range([0, innerWidth]);

        // Stacked bars
        data.forEach(d => {
          const segments = [
            { x0: 0, x1: d.top1_pct, color: colors.top1, label: 'Top 1' },
            { x0: d.top1_pct, x1: d.top5_pct, color: colors.top5, label: 'Top 2-5' },
            { x0: d.top5_pct, x1: d.top10_pct, color: colors.top10, label: 'Top 6-10' },
            { x0: d.top10_pct, x1: d.top20_pct, color: colors.top20, label: 'Top 11-20' },
            { x0: d.top20_pct, x1: 100, color: colors.rest, label: 'Others' },
          ];

          segments.forEach(seg => {
            g.append('rect')
              .attr('x', x(seg.x0))
              .attr('y', y(d.name))
              .attr('width', x(seg.x1) - x(seg.x0))
              .attr('height', y.bandwidth())
              .attr('fill', seg.color)
              .attr('rx', 2)
              .on('mouseover', (event) => {
                const tooltip = d3.select('#tooltip');
                tooltip.style('opacity', 1)
                  .html(`<strong>${d.name}</strong><br>` +
                    `Top artist: ${d.top_artist} (${d.top1_pct}%)<br>` +
                    `Top 5: ${d.top5_pct}% | Top 10: ${d.top10_pct}% | Top 20: ${d.top20_pct}%<br>` +
                    `Total artists exported: ${d.n_artists}`)
                  .style('left', (event.pageX + 12) + 'px')
                  .style('top', (event.pageY - 10) + 'px');
              })
              .on('mouseout', () => {
                d3.select('#tooltip').style('opacity', 0);
              });
          });

          // Country label
          g.append('text')
            .attr('x', -8)
            .attr('y', y(d.name) + y.bandwidth() / 2 + 4)
            .attr('text-anchor', 'end')
            .attr('fill', '#ccc')
            .attr('font-size', '12px')
            .text(d.name);

          // Top artist annotation
          g.append('text')
            .attr('x', innerWidth + 8)
            .attr('y', y(d.name) + y.bandwidth() / 2 + 4)
            .attr('fill', '#888')
            .attr('font-size', '11px')
            .text(`${d.top_artist} (${d.top1_pct}%)`);
        });

        // X axis
        g.append('g')
          .attr('transform', `translate(0, -8)`)
          .call(d3.axisTop(x).ticks(5).tickFormat(d => d + '%'))
          .call(g => g.select('.domain').remove())
          .call(g => g.selectAll('text').attr('fill', '#888').attr('font-size', '11px'))
          .call(g => g.selectAll('line').attr('stroke', '#333'));
      });
  </script>
</body>
</html>
