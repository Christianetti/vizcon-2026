<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Is My Country Rich in Music Currency? | VizContest 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300..800;1,9..40,300..800&family=Lora:ital,wght@0,400..700;1,400..700&display=swap" rel="stylesheet">
<script src="https://d3js.org/d3.v7.min.js"></script>
<script src="https://unpkg.com/topojson-client@3"></script>
<style>
:root {
  --sans: 'DM Sans', sans-serif;
  --serif: 'Lora', serif;
  --bg: #e6e5e5;
  --text: #1a1a1a;
  --text-muted: #6d6d6d;
  --highlight: #3a7fa7;
  --white: #ffffff;
  --gray-300: #cacaca;
  --gray-800: #333333;
}

*, *::before, *::after {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html {
  scroll-snap-type: y mandatory;
  overflow-y: scroll;
  scroll-behavior: smooth;
}

body {
  font-family: var(--sans);
  color: var(--text);
  font-size: 16px;
  line-height: 1.6;
  background: var(--bg);
  -webkit-font-smoothing: antialiased;
}

/* Hero */
.hero {
  scroll-snap-align: start;
  height: 100svh;
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  overflow: hidden;
}

.hero__map {
  position: absolute;
  inset: 0;
  z-index: 0;
  opacity: 0.4;
}

.hero__map svg {
  width: 100%;
  height: 100%;
}

.hero__content {
  position: relative;
  z-index: 2;
  max-width: 720px;
  padding: 0 24px;
}

.hero h1 {
  font-family: var(--serif);
  font-size: clamp(2rem, 5vw, 3.8rem);
  font-weight: 700;
  line-height: 1.15;
  color: var(--text);
  margin-bottom: 16px;
}

.hero h1 .highlight {
  color: var(--highlight);
}

.hero h2 {
  font-family: var(--sans);
  font-size: clamp(1.1rem, 2.5vw, 1.6rem);
  font-weight: 400;
  color: var(--text-muted);
  margin-bottom: 24px;
}

.hero__description {
  font-family: var(--serif);
  font-size: clamp(0.9rem, 1.2vw, 1.05rem);
  color: var(--text-muted);
  margin-bottom: 32px;
  font-style: italic;
}

.hero__player {
  position: relative;
  z-index: 2;
  width: 100%;
  max-width: 360px;
  margin: 0 auto;
}

.hero__player iframe {
  border-radius: 12px;
}

.hero__song-info {
  font-size: 0.8rem;
  color: var(--text-muted);
  margin-top: 8px;
  letter-spacing: 0.02em;
}

/* Bubble countries on map */
.country-bubble {
  fill: var(--highlight);
  opacity: 0.6;
  transition: opacity 0.3s;
}

.country-bubble:hover {
  opacity: 1;
}

/* Mobile */
@media (max-width: 767px) {
  .hero h1 {
    font-size: clamp(1.6rem, 7vw, 2.4rem);
  }

  .hero h2 {
    font-size: clamp(1rem, 4vw, 1.3rem);
  }

  .hero__player {
    max-width: 100%;
  }
}
</style>
</head>
<body>

<!-- Hero -->
<section class="hero" id="hero">
  <div class="hero__map" id="hero-map"></div>
  <div class="hero__content">
    <h1>What if music was the only <span class="highlight">currency</span> for world's countries economies?</h1>
    <h2>How connected would be yours?</h2>
    <p class="hero__description">A brief Spotify Top-100 weekly charts from 70 countries since 2017.</p>
    <div class="hero__player">
      <iframe id="hero-spotify" style="border-radius:12px" src="" width="100%" height="80" frameBorder="0" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" loading="lazy"></iframe>
      <p class="hero__song-info" id="hero-song-info"></p>
    </div>
  </div>
</section>

<script>
const CHART_COUNTRIES = [
  "AE","AR","AT","AU","BE","BG","BO","BR","CA","CH","CL","CO","CR","CZ","DE",
  "DK","DO","EC","EE","EG","ES","FI","FR","GB","GR","GT","HK","HN","HU","ID",
  "IE","IL","IN","IS","IT","JP","KR","LT","LU","LV","MA","MX","MY","NG","NI",
  "NL","NO","NZ","PA","PE","PH","PK","PL","PT","PY","RO","SA","SE","SG","SK",
  "SV","TH","TR","TW","UA","US","UY","VE","VN","ZA"
];

// Load a random song between rank 23-93 from data
fetch('country_profiles.json')
  .then(r => r.json())
  .then(data => {
    const eligible = data.top100_songs.filter(s => s.rank >= 23 && s.rank <= 93);
    const song = eligible[Math.floor(Math.random() * eligible.length)];
    document.getElementById('hero-spotify').src =
      `https://open.spotify.com/embed/track/${song.track_id}?utm_source=generator&theme=0`;
    document.getElementById('hero-song-info').textContent =
      `${song.name}, ${song.artist} - #${song.rank} Top Ranking from 2017-2026`;
  });

// World map with floating bubbles
async function renderHeroMap() {
  const container = document.getElementById('hero-map');
  const width = container.clientWidth;
  const height = container.clientHeight;

  const svg = d3.select(container)
    .append('svg')
    .attr('width', width)
    .attr('height', height);

  // Load world topology
  const world = await d3.json('https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json');
  const countries = topojson.feature(world, world.objects.countries);

  const projection = d3.geoNaturalEarth1()
    .fitSize([width, height], countries);

  const path = d3.geoPath().projection(projection);

  // Draw all countries faintly
  svg.append('g')
    .selectAll('path')
    .data(countries.features)
    .enter()
    .append('path')
    .attr('d', path)
    .attr('fill', '#d0d0d0')
    .attr('stroke', '#bbb')
    .attr('stroke-width', 0.3);

  // Get centroids for our 70 chart countries
  // Map ISO alpha-2 to numeric for matching
  const alpha2ToName = {};
  CHART_COUNTRIES.forEach(code => { alpha2ToName[code] = true; });

  // We'll place bubbles at projected centroids of matching countries
  // Since world-atlas uses numeric IDs, we'll compute centroids from the geo
  // and place bubbles using a lookup of approximate lat/lon per alpha-2
  const countryCoords = {
    AE:[54,24],AR:[-64,-34],AT:[14,47],AU:[134,-25],BE:[4,51],BG:[25,43],
    BO:[-65,-17],BR:[-52,-10],CA:[-106,56],CH:[8,47],CL:[-71,-30],CO:[-72,4],
    CR:[-84,10],CZ:[15,50],DE:[10,51],DK:[10,56],DO:[-70,19],EC:[-78,-2],
    EE:[26,59],EG:[30,27],ES:[-4,40],FI:[26,64],FR:[2,46],GB:[-2,54],
    GR:[22,39],GT:[-90,15],HK:[114,22],HN:[-87,15],HU:[20,47],ID:[120,-5],
    IE:[-8,53],IL:[35,31],IN:[79,21],IS:[-19,65],IT:[12,42],JP:[138,36],
    KR:[128,36],LT:[24,56],LU:[6,50],LV:[25,57],MA:[-6,32],MX:[-102,23],
    MY:[102,4],NG:[8,10],NI:[-85,13],NL:[5,52],NO:[10,62],NZ:[174,-41],
    PA:[-80,9],PE:[-76,-10],PH:[122,13],PK:[69,30],PL:[20,52],PT:[-8,39],
    PY:[-58,-23],RO:[25,46],SA:[45,24],SE:[16,62],SG:[104,1],SK:[19,49],
    SV:[-89,14],TH:[101,15],TR:[35,39],TW:[121,24],UA:[32,49],US:[-97,38],
    UY:[-56,-33],VE:[-66,7],VN:[108,16],ZA:[24,-29]
  };

  // Draw floating bubbles
  const bubbles = svg.append('g')
    .selectAll('circle')
    .data(CHART_COUNTRIES)
    .enter()
    .append('circle')
    .attr('class', 'country-bubble')
    .attr('cx', d => {
      const coords = countryCoords[d];
      return coords ? projection(coords)[0] : 0;
    })
    .attr('cy', d => {
      const coords = countryCoords[d];
      return coords ? projection(coords)[1] : 0;
    })
    .attr('r', d => 6 + Math.random() * 8);

  // Sequential animation: one country lights up at a time
  let currentIdx = 0;

  function pulseNext() {
    // Reset previous bubble
    bubbles.attr('r', 6).attr('opacity', 0.3);

    // Pulse current bubble
    const current = d3.select(bubbles.nodes()[currentIdx]);
    current
      .transition()
      .duration(400)
      .ease(d3.easeCubicOut)
      .attr('r', 18)
      .attr('opacity', 0.9)
      .transition()
      .duration(600)
      .ease(d3.easeCubicIn)
      .attr('r', 8)
      .attr('opacity', 0.5);

    currentIdx = (currentIdx + 1) % CHART_COUNTRIES.length;
    setTimeout(pulseNext, 1200);
  }

  pulseNext();
}

renderHeroMap();
</script>

</body>
</html>
